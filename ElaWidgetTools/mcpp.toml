[package]
name = "ElaWidgetTools"
version = "2.0.0"

[build-dependencies]
mcpp.plugins = { version = "0.18.1", features = ["rules-qt"], host-module = true }

[build]
default-profile = "release"
sources = ["**/*.cpp"]
include_dirs = [".", "private", "DeveloperComponents", "DeveloperComponents/Command"]
# 原 CMakeLists 显式定义的 DLL 导出宏，仅库编译使用。
defines = ["ELAWIDGETTOOLS_LIBRARY"]

[target.windows.build]
ldflags = ["-ld3d11", "-ldxgi", "-luser32", "-lgdi32", "-ldwmapi", "-lshell32"]

[targets.ElaWidgetTools]
kind = "shared"
windows_auto_export = false
